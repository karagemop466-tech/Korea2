name: data-pipeline

# Issue #20 fix: the analysis loop no longer swallows failures (`|| echo FAILED`
# was removed), every step is fail-closed, and the result is proposed as a pull
# request from a short-lived branch instead of being pushed to main with
# `[skip ci]`.
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/data-pipeline.yml'

permissions:
  contents: write        # push the short-lived refresh branch
  pull-requests: write   # open the refresh pull request

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Fetch upstream data (fail-closed)
        # scripts/fetch_data.py exits non-zero when any download fails, and
        # pipefail makes tee propagate that exit code.
        run: |
          set -o pipefail
          python scripts/fetch_data.py 2>&1 | tee -a data/derived/run_log.txt

      - name: Analysis (fail-closed)
        run: |
          set -euo pipefail
          for s in diag_signs analyze_market analyze_model analyze_correlation analyze_luck analyze_strategies analyze_props; do
            if [ -f "scripts/$s.py" ]; then
              echo "=== $s ===" | tee -a data/derived/run_log.txt
              python "scripts/$s.py" 2>&1 | tee -a data/derived/run_log.txt
            fi
          done

      - name: Build site
        run: python scripts/build_site.py 2>&1 | tee -a data/derived/run_log.txt

      - name: Verify site ownership and data invariants (fail-closed)
        run: |
          set -euo pipefail
          # The published root site must be this generator's output, not a sibling
          # session's rebuild of the same paths. Fail loudly if ownership changed.
          python - <<'EOF'
          import sys
          html = open("index.html").read()
          ok = "line-lab/scripts/build_site.py" in html
          print("published site owner:", "line-lab" if ok else "UNKNOWN - sibling generator")
          sys.exit(0 if ok else 1)
          EOF
          python tests/check_site.py 2>&1 | tee -a data/derived/run_log.txt
          python tests/check_data.py 2>&1 | tee -a data/derived/run_log.txt

      - name: Open the refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "line-lab-bot"
          git config user.email "line-lab-bot@users.noreply.github.com"
          git add -f data/derived
          git add index.html pages assets results
          if git diff --cached --quiet; then
            echo "no changes after rebuild - nothing to propose"
            exit 0
          fi
          BRANCH="line-lab-refresh/run-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data: refresh derived datasets, results and rendered site"
          git push origin "$BRANCH"
          {
            echo "Automated rebuild of the line-lab pipeline, run \`${GITHUB_RUN_ID}\`."
            echo
            echo "* fetch: fail-closed (\`scripts/fetch_data.py\` exits non-zero on any failed download)"
            echo "* analysis: fail-closed (the old \`|| echo FAILED\` fallback is gone)"
            echo "* checks on the runner before this PR: site-ownership guard, \`tests/check_site.py\`, \`tests/check_data.py\`"
            echo
            echo "Review the number changes before merging. Nothing was pushed to \`main\`."
            echo
            echo "Note: branches pushed with the Actions \`GITHUB_TOKEN\` do not trigger further workflows, so the checks that gated this PR are the ones above, run on the runner before it was opened. Re-run them from the Actions tab with \`workflow_dispatch\` if you want a second pass."
          } > /tmp/pr_body.md
          gh pr create --base main --head "$BRANCH" \
            --title "Data rebuild: derived datasets + regenerated site" \
            --body-file /tmp/pr_body.md
