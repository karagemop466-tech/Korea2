name: data-pipeline
on:
  workflow_dispatch:
  push:
    branches: ['arena/70a33596-korea2', main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/data-pipeline.yml'
permissions:
  contents: write
concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch upstream data
        run: python scripts/fetch_data.py
      - name: Profile dataset
        run: python scripts/profile.py
      - name: Commit derived data
        run: |
          git config user.name "line-lab-bot"
          git config user.email "line-lab-bot@users.noreply.github.com"
          git add -f data/derived
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: refresh derived datasets [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
