name: validate

on:
  push:
    branches: [main, arena/29806afc-korea2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate data rows and official-source policy
        run: python3 scripts/validate_data.py
      - name: Check internal site links
        run: python3 scripts/check_links.py
      - name: Derived data invariants (strict JSON, verification record, no orphan pages)
        run: python3 tests/check_derived.py
      - name: Re-run the independent verification (needs pandas/numpy/scipy only)
        run: |
          pip install --quiet pandas numpy scipy
          python3 verification/recompute.py
