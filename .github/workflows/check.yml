name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned to the versions this build ran on)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (settlement, odds, statistics, published artefacts)
        run: python -m unittest discover -s pipeline/tests -t pipeline -v

      - name: Static link check (no network required)
        run: python pipeline/check_links.py

      - name: Confirm every page renders from the committed artefacts
        run: python pipeline/tests/test_site_artefacts.py
