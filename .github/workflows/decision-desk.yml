name: decision-desk

# Verification gate for the Decision Desk sub-site (data/, pages/, scripts/).
# Keeps the per-row source-link policy, blank-unverified policy and deterministic
# rebuild enforced on every push to this session's branch.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Decision Desk (schema, cross-refs, blank policy, source cells, rebuild)
        run: python3 decision-desk/scripts/verify_all.py

      - name: Repo-wide link check (includes Decision Desk pages)
        run: python3 scripts/check_links.py

      - name: Site rules (titles, https, per-row sources on published pages)
        run: python3 tests/check_site.py
