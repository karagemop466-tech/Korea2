name: build-verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --quiet pandas numpy scipy
      - name: Rebuild every result and page from the committed data
        run: python scripts/analysis/build.py
      - name: Results are reproducible (no diff after rebuild)
        # Scope note (integration session arena/70a33596-korea2, 2026-11-01): the published root site
        # (index.html, pages/) is now generated by scripts/build_site.py from data/derived/*.json, so a
        # rebuild by scripts/analysis/build.py is expected to differ there. This check is therefore
        # limited to `results`, which is what scripts/analysis/build.py owns. Revert if that ownership
        # changes.
        run: |
          if ! git diff --quiet -- results; then
            git --no-pager diff --stat -- results
            echo "::error::build output differs from what is committed"
            exit 1
          fi
      - name: Statistical invariants
        run: python tests/check_data.py
      - name: Links, navigation and source coverage
        run: python tests/check_site.py
      - name: Independent recomputation of the published numbers
        # Second implementation, written by the 2026-11-13 integration session. It imports nothing
        # from scripts/ or pipeline/, reads only committed extracts, and exits non-zero if a
        # published value disagrees with the recomputed one.
        run: |
          python verification/integration_recompute.py
          if ! git diff --quiet -- verification/integration_recompute.json; then
            git --no-pager diff --stat -- verification/integration_recompute.json
            echo "::error::the committed integration recomputation no longer matches the committed data"
            exit 1
          fi
      - name: The committed 2026 snapshot reconciles with the official standings page
        # Replays the committed extract game by game, applies the officially reported results that
        # post-date it, and compares every one of the 32 teams with the transcribed official page.
        run: |
          python verification/standings_reconcile.py
          if ! git diff --quiet -- verification/standings_reconcile.json; then
            git --no-pager diff --stat -- verification/standings_reconcile.json
            echo "::error::the committed standings reconciliation no longer matches the committed data"
            exit 1
          fi
      - name: The published site is reproducible from the committed data
        run: |
          python scripts/build_site.py
          if ! git diff --quiet -- index.html pages; then
            git --no-pager diff --stat -- index.html pages
            echo "::error::the published pages differ from what the generator produces"
            exit 1
          fi
