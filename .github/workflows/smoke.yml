name: smoke
on:
  workflow_dispatch:
  push:
    branches: [arena/70a33596-korea2]
    paths: ['.github/workflows/smoke.yml']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: echo "actions-ok $(date -u)"
      - run: curl -sI https://github.com/nflverse/nflverse-data/releases/download/schedules/timestamp.txt | head -3
