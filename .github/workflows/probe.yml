name: probe
on:
  push:
    branches: ['arena/52a496d0-korea2']
    paths: ['decision-arena/PROBE']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run run_all exactly as the workflow does
        run: |
          set +e
          python decision-arena/scripts/fetch_inputs.py --season 2026 > /tmp/f.log 2>&1
          python decision-arena/scripts/run_all.py > /tmp/r.log 2>&1; RC=$?
          {
            echo "run_all rc=$RC"
            echo "=== last 60 lines ==="
            tail -60 /tmp/r.log
          } > decision-arena/PROBE_RESULT.txt
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "p@users.noreply.github.com"
          git add -f decision-arena/PROBE_RESULT.txt
          git commit -m "probe: run_all on the runner" || true
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" || true; git push origin "HEAD:${{ github.ref_name }}" && break; sleep 4; done
